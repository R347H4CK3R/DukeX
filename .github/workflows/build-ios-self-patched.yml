name: Build Self-Patched DukeX iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/build-ios-self-patched.yml'
      - '.github/scripts/apply_dukex_background_fix.py'
      - '.github/scripts/apply_ios_sdl_mainthread_fix.py'
      - '.github/scripts/apply_ios_coroutine_lazy_fix.py'
      - 'ios/**'
      - 'ui/xemu.c'
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/build-ios-self-patched.yml'
      - '.github/scripts/apply_dukex_background_fix.py'
      - '.github/scripts/apply_ios_sdl_mainthread_fix.py'
      - '.github/scripts/apply_ios_coroutine_lazy_fix.py'
      - 'ios/**'
      - 'ui/xemu.c'

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15-intel
    timeout-minutes: 120

    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      IOS_DEPLOYMENT_TARGET: "16.0"
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.cache/vcpkg-binaries
      XEMU_IOS_BUILD_DIR: ${{ github.workspace }}/build-ios-arm64
      DUKE_X_DERIVED_DATA: ${{ github.workspace }}/.cache/DukeXDerivedData

    steps:
      - name: Checkout DukeX
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: .cache/vcpkg-binaries
          key: vcpkg-arm64-ios-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/workflows/build-ios-self-patched.yml') }}
          restore-keys: |
            vcpkg-arm64-ios-${{ runner.os }}-${{ runner.arch }}-

      - name: Restore incremental core and Xcode build caches
        uses: actions/cache@v4
        with:
          path: |
            build-ios-arm64
            .cache/DukeXDerivedData
          key: dukex-ios-build-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            dukex-ios-build-${{ runner.os }}-${{ runner.arch }}-

      - name: Apply lifecycle fix
        run: python3 .github/scripts/apply_dukex_background_fix.py

      - name: Apply iOS SDL main-thread fix
        run: python3 .github/scripts/apply_ios_sdl_mainthread_fix.py

      - name: Apply iOS lazy coroutine fix
        run: python3 .github/scripts/apply_ios_coroutine_lazy_fix.py

      - name: Verify lifecycle, SDL, and coroutine fixes
        run: |
          grep -n "xemu_ios_set_application_active" ui/xemu.c
          grep -n "xemu_ios_prepare_sdl_video" ui/xemu.c
          grep -n "loadSetApplicationActive" ios/DukeX/DukeX/Runtime/Core/EmulatorCoreRuntime.swift
          grep -n "loadPrepareSDLVideo" ios/DukeX/DukeX/Runtime/Core/EmulatorCoreRuntime.swift
          grep -n "UIApplication.willResignActiveNotification" ios/DukeX/DukeX/Runtime/Core/EmulatorCoreRuntime.swift
          grep -n "refusing background SDL_Init" ui/xemu.c
          grep -n "coroutine global pool prime disabled" util/qemu-coroutine.c
          grep -n "coroutine sigaltstack bootstrap: signal queue" util/coroutine-sigaltstack.c
          grep -n "coroutine sigaltstack bootstrap: trampoline returned" util/coroutine-sigaltstack.c
          grep -n 'XEMU_IOS_COROUTINE_BACKEND=.*sigaltstack' ios/scripts/build-core-ios.sh
          if sed -n '/void xemu_ios_coroutine_prime_global_pool/,/^#endif/p' util/qemu-coroutine.c | grep -q 'qemu_coroutine_new();'; then
            echo "Eager coroutine creation is still present in iOS primer" >&2
            exit 1
          fi
          if grep -q 'raise(SIGUSR2)' util/coroutine-sigaltstack.c; then
            echo "Unsafe iOS raise(SIGUSR2) coroutine bootstrap is still present" >&2
            exit 1
          fi

      - name: Install missing build tools
        run: |
          packages=()
          command -v cmake >/dev/null || packages+=(cmake)
          command -v ninja >/dev/null || packages+=(ninja)
          command -v meson >/dev/null || packages+=(meson)
          command -v pkg-config >/dev/null || packages+=(pkg-config)
          command -v autoconf >/dev/null || packages+=(autoconf)
          command -v automake >/dev/null || packages+=(automake)
          command -v libtoolize >/dev/null || packages+=(libtool)
          command -v nasm >/dev/null || packages+=(nasm)
          if ((${#packages[@]})); then
            brew install "${packages[@]}"
          else
            echo "Required build tools are already available."
          fi

      - name: Bootstrap vcpkg
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - name: Patch vcpkg iOS ports and linker flags
        run: |
          ICONV_PORT="$RUNNER_TEMP/vcpkg/ports/libiconv/portfile.cmake"
          EPOXY_PORT="$RUNNER_TEMP/vcpkg/ports/libepoxy/portfile.cmake"
          PCAP_PORT="$RUNNER_TEMP/vcpkg/ports/libpcap/portfile.cmake"
          IOS_TRIPLET="$RUNNER_TEMP/vcpkg/triplets/community/arm64-ios.cmake"
          SDL_PORT="$RUNNER_TEMP/vcpkg/ports/sdl3/portfile.cmake"

          python3 - <<'PY'
          from pathlib import Path
          import os, re

          root = Path(os.environ["RUNNER_TEMP"]) / "vcpkg"
          iconv = root / "ports/libiconv/portfile.cmake"
          s = iconv.read_text()
          old = """if (NOT VCPKG_TARGET_IS_ANDROID)
              vcpkg_list(APPEND OPTIONS --enable-relocatable)
          endif()"""
          new = """if (NOT VCPKG_TARGET_IS_ANDROID AND NOT VCPKG_TARGET_IS_IOS)
              vcpkg_list(APPEND OPTIONS --enable-relocatable)
          endif()"""
          if old not in s:
              raise SystemExit("Expected libiconv relocatable block not found")
          iconv.write_text(s.replace(old, new, 1))

          epoxy = root / "ports/libepoxy/portfile.cmake"
          e = epoxy.read_text()
          old_epoxy = "if (VCPKG_TARGET_IS_WINDOWS OR VCPKG_TARGET_IS_OSX)"
          new_epoxy = "if (VCPKG_TARGET_IS_WINDOWS OR VCPKG_TARGET_IS_OSX OR VCPKG_TARGET_IS_IOS)"
          if old_epoxy not in e:
              raise SystemExit("Expected libepoxy Apple target condition not found")
          epoxy.write_text(e.replace(old_epoxy, new_epoxy, 1))

          pcap = root / "ports/libpcap/portfile.cmake"
          p = pcap.read_text()
          needle = "vcpkg_cmake_configure(\n"
          if needle not in p:
              raise SystemExit("Unexpected libpcap port layout")
          pcap.write_text(p.replace(needle, needle + "    OPTIONS\n        -DPCAP_TYPE=null\n", 1))

          triplet = root / "triplets/community/arm64-ios.cmake"
          t = triplet.read_text()
          if "CoreFoundation" not in t:
              t += ('\n# Static gettext-libintl calls CoreFoundation on Apple targets.\n'
                    'set(VCPKG_LINKER_FLAGS "${VCPKG_LINKER_FLAGS} -framework CoreFoundation")\n'
                    'set(VCPKG_LINKER_FLAGS_DEBUG "${VCPKG_LINKER_FLAGS_DEBUG} -framework CoreFoundation")\n'
                    'set(VCPKG_LINKER_FLAGS_RELEASE "${VCPKG_LINKER_FLAGS_RELEASE} -framework CoreFoundation")\n')
              triplet.write_text(t)

          sdl_port = root / "ports/sdl3/portfile.cmake"
          sp = sdl_port.read_text()
          sp2 = re.sub(r'^\s*dukex-ios-uikit-main-thread\.patch\s*$', '', sp, flags=re.M)
          if sp2 != sp:
              sdl_port.write_text(sp2)
              print("Removed malformed duplicate DukeX SDL patch from vcpkg sdl3 port")
          else:
              print("No DukeX SDL patch reference present in current vcpkg; nothing to remove")
          PY

          grep -q 'NOT VCPKG_TARGET_IS_ANDROID AND NOT VCPKG_TARGET_IS_IOS' "$ICONV_PORT"
          grep -q 'VCPKG_TARGET_IS_OSX OR VCPKG_TARGET_IS_IOS' "$EPOXY_PORT"
          grep -q -- '-DPCAP_TYPE=null' "$PCAP_PORT"
          grep -q 'CoreFoundation' "$IOS_TRIPLET"
          if grep -q 'dukex-ios-uikit-main-thread.patch' "$SDL_PORT"; then
            echo "Malformed SDL patch is still referenced" >&2
            exit 1
          fi

      - name: Install iOS dependencies
        run: |
          "$RUNNER_TEMP/vcpkg/vcpkg" install \
            glib:arm64-ios \
            pixman:arm64-ios \
            libslirp:arm64-ios \
            sdl3:arm64-ios \
            zlib:arm64-ios \
            libepoxy:arm64-ios \
            libpcap:arm64-ios \
            libsamplerate:arm64-ios

      - name: Resolve MoltenVK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --retry 5 --retry-all-errors -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/KhronosGroup/MoltenVK/releases/latest \
            -o "$RUNNER_TEMP/mvk.json"
          python3 - "$RUNNER_TEMP/mvk.json" >> "$GITHUB_ENV" <<'PY'
          import json, sys
          d = json.load(open(sys.argv[1]))
          asset = next(a for a in d["assets"] if a["name"].endswith((".tar", ".tar.gz", ".zip")))
          print("MOLTENVK_TAG=" + d["tag_name"])
          print("MOLTENVK_ASSET_API_URL=" + asset["url"])
          print("MOLTENVK_ASSET_NAME=" + asset["name"])
          PY

      - name: Restore MoltenVK cache
        id: moltenvk-cache
        uses: actions/cache@v4
        with:
          path: .cache/moltenvk
          key: moltenvk-ios-${{ runner.os }}-${{ env.MOLTENVK_TAG }}

      - name: Prepare MoltenVK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MVK_CACHE="$GITHUB_WORKSPACE/.cache/moltenvk/$MOLTENVK_TAG"
          if ! find "$MVK_CACHE" -type f -path '*/include/vulkan/vulkan.h' -print -quit 2>/dev/null | grep -q .; then
            rm -rf "$MVK_CACHE"
            mkdir -p "$MVK_CACHE"
            echo "Downloading MoltenVK asset: $MOLTENVK_ASSET_NAME"
            curl --retry 5 --retry-all-errors -fL \
              -H "Accept: application/octet-stream" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$MOLTENVK_ASSET_API_URL" -o "$RUNNER_TEMP/mvk.pkg"
            if file "$RUNNER_TEMP/mvk.pkg" | grep -qi zip; then
              unzip -q "$RUNNER_TEMP/mvk.pkg" -d "$MVK_CACHE"
            else
              tar -xf "$RUNNER_TEMP/mvk.pkg" -C "$MVK_CACHE"
            fi
          else
            echo "Using cached MoltenVK $MOLTENVK_TAG"
          fi
          MOLTENVK_ROOT=$(find "$MVK_CACHE" -type f -path '*/include/vulkan/vulkan.h' -print -quit | sed 's#/include/vulkan/vulkan.h##')
          MOLTENVK_FRAMEWORK=$(find "$MVK_CACHE" -type d -path '*/MoltenVK.xcframework/ios-arm64/MoltenVK.framework' -print -quit)
          test -n "$MOLTENVK_ROOT"
          test -f "$MOLTENVK_FRAMEWORK/MoltenVK"
          echo "MOLTENVK_ROOT=$MOLTENVK_ROOT" >> "$GITHUB_ENV"
          echo "MOLTENVK_FRAMEWORK=$MOLTENVK_FRAMEWORK" >> "$GITHUB_ENV"

      - name: Build embedded iOS core
        run: |
          chmod +x ios/scripts/build-core-ios.sh
          ios/scripts/build-core-ios.sh
          test -f build-ios-arm64/libxemu-ios-core.dylib

      - name: Build unsigned app
        run: |
          xcodebuild -project ios/DukeX/DukeX.xcodeproj -scheme DukeX -configuration Release -sdk iphoneos -destination "generic/platform=iOS" -derivedDataPath "$DUKE_X_DERIVED_DATA" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          APP="$DUKE_X_DERIVED_DATA/Build/Products/Release-iphoneos/DukeX.app"
          test -d "$APP"
          mkdir -p "$APP/Frameworks"
          rm -rf "$APP/Frameworks/MoltenVK.framework"
          ditto "$MOLTENVK_FRAMEWORK" "$APP/Frameworks/MoltenVK.framework"
          test -f "$APP/Frameworks/MoltenVK.framework/MoltenVK"
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"

      - name: Verify packaged Vulkan runtime
        run: |
          test -f "$APP_PATH/Frameworks/MoltenVK.framework/MoltenVK"
          file "$APP_PATH/Frameworks/MoltenVK.framework/MoltenVK" | grep -q 'arm64'
          echo "MoltenVK iOS runtime is present in the app bundle."

      - name: Package unsigned IPA
        run: |
          rm -rf Payload DukeX-self-patched-unsigned.ipa
          mkdir Payload
          cp -R "$APP_PATH" Payload/DukeX.app
          find Payload -name '._*' -delete || true
          xattr -cr Payload || true
          ditto -c -k --sequesterRsrc --keepParent Payload DukeX-self-patched-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DukeX-self-patched-unsigned-ipa
          path: DukeX-self-patched-unsigned.ipa
          retention-days: 14
