name: Build Self-Patched DukeX iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - '.github/workflows/build-ios-self-patched.yml'
      - '.github/scripts/apply_dukex_background_fix.py'
      - '.github/scripts/apply_ios_sdl_mainthread_fix.py'
      - 'ios/**'
      - 'ui/xemu.c'
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/build-ios-self-patched.yml'
      - '.github/scripts/apply_dukex_background_fix.py'
      - '.github/scripts/apply_ios_sdl_mainthread_fix.py'
      - 'ios/**'
      - 'ui/xemu.c'

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15-intel
    timeout-minutes: 120

    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
      IOS_DEPLOYMENT_TARGET: "16.0"

    steps:
      - name: Checkout DukeX
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply lifecycle fix
        run: python3 .github/scripts/apply_dukex_background_fix.py

      - name: Apply iOS SDL main-thread fix
        run: python3 .github/scripts/apply_ios_sdl_mainthread_fix.py

      - name: Verify lifecycle and SDL fixes
        run: |
          grep -n "xemu_ios_set_application_active" ui/xemu.c
          grep -n "xemu_ios_prepare_sdl_video" ui/xemu.c
          grep -n "loadSetApplicationActive" ios/DukeX/DukeX/Runtime/Core/EmulatorCoreRuntime.swift
          grep -n "loadPrepareSDLVideo" ios/DukeX/DukeX/Runtime/Core/EmulatorCoreRuntime.swift
          grep -n "UIApplication.willResignActiveNotification" ios/DukeX/DukeX/Runtime/Core/EmulatorCoreRuntime.swift
          grep -n "refusing background SDL_Init" ui/xemu.c

      - name: Install build tools
        run: |
          brew install cmake ninja meson pkg-config autoconf automake libtool nasm

      - name: Bootstrap vcpkg
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$RUNNER_TEMP/vcpkg" >> "$GITHUB_ENV"

      - name: Patch vcpkg iOS ports and linker flags
        run: |
          ICONV_PORT="$RUNNER_TEMP/vcpkg/ports/libiconv/portfile.cmake"
          EPOXY_PORT="$RUNNER_TEMP/vcpkg/ports/libepoxy/portfile.cmake"
          PCAP_PORT="$RUNNER_TEMP/vcpkg/ports/libpcap/portfile.cmake"
          IOS_TRIPLET="$RUNNER_TEMP/vcpkg/triplets/community/arm64-ios.cmake"
          SDL_PORT="$RUNNER_TEMP/vcpkg/ports/sdl3/portfile.cmake"

          python3 - <<'PY'
          from pathlib import Path
          import os, re

          root = Path(os.environ["RUNNER_TEMP"]) / "vcpkg"
          iconv = root / "ports/libiconv/portfile.cmake"
          s = iconv.read_text()
          old = """if (NOT VCPKG_TARGET_IS_ANDROID)
              vcpkg_list(APPEND OPTIONS --enable-relocatable)
          endif()"""
          new = """if (NOT VCPKG_TARGET_IS_ANDROID AND NOT VCPKG_TARGET_IS_IOS)
              vcpkg_list(APPEND OPTIONS --enable-relocatable)
          endif()"""
          if old not in s:
              raise SystemExit("Expected libiconv relocatable block not found")
          iconv.write_text(s.replace(old, new, 1))

          epoxy = root / "ports/libepoxy/portfile.cmake"
          e = epoxy.read_text()
          old_epoxy = "if (VCPKG_TARGET_IS_WINDOWS OR VCPKG_TARGET_IS_OSX)"
          new_epoxy = "if (VCPKG_TARGET_IS_WINDOWS OR VCPKG_TARGET_IS_OSX OR VCPKG_TARGET_IS_IOS)"
          if old_epoxy not in e:
              raise SystemExit("Expected libepoxy Apple target condition not found")
          epoxy.write_text(e.replace(old_epoxy, new_epoxy, 1))

          pcap = root / "ports/libpcap/portfile.cmake"
          p = pcap.read_text()
          needle = "vcpkg_cmake_configure(\n"
          if needle not in p:
              raise SystemExit("Unexpected libpcap port layout")
          pcap.write_text(p.replace(needle, needle + "    OPTIONS\n        -DPCAP_TYPE=null\n", 1))

          triplet = root / "triplets/community/arm64-ios.cmake"
          t = triplet.read_text()
          if "CoreFoundation" not in t:
              t += ('\n# Static gettext-libintl calls CoreFoundation on Apple targets.\n'
                    'set(VCPKG_LINKER_FLAGS "${VCPKG_LINKER_FLAGS} -framework CoreFoundation")\n'
                    'set(VCPKG_LINKER_FLAGS_DEBUG "${VCPKG_LINKER_FLAGS_DEBUG} -framework CoreFoundation")\n'
                    'set(VCPKG_LINKER_FLAGS_RELEASE "${VCPKG_LINKER_FLAGS_RELEASE} -framework CoreFoundation")\n')
              triplet.write_text(t)

          # The temporary DukeX SDL patch shipped in the vcpkg checkout has
          # malformed unified-diff hunks. DukeX now applies the iOS SDL
          # main-thread fix directly to its own source before dependencies are
          # built, so do not ask vcpkg to apply the broken duplicate patch.
          sdl_port = root / "ports/sdl3/portfile.cmake"
          sp = sdl_port.read_text()
          sp2 = re.sub(r'^\s*dukex-ios-uikit-main-thread\.patch\s*$', '', sp, flags=re.M)
          if sp2 != sp:
              sdl_port.write_text(sp2)
              print("Removed malformed duplicate DukeX SDL patch from vcpkg sdl3 port")
          else:
              print("No DukeX SDL patch reference present in current vcpkg; nothing to remove")
          PY

          grep -q 'NOT VCPKG_TARGET_IS_ANDROID AND NOT VCPKG_TARGET_IS_IOS' "$ICONV_PORT"
          grep -q 'VCPKG_TARGET_IS_OSX OR VCPKG_TARGET_IS_IOS' "$EPOXY_PORT"
          grep -q -- '-DPCAP_TYPE=null' "$PCAP_PORT"
          grep -q 'CoreFoundation' "$IOS_TRIPLET"
          if grep -q 'dukex-ios-uikit-main-thread.patch' "$SDL_PORT"; then
            echo "Malformed SDL patch is still referenced" >&2
            exit 1
          fi

      - name: Install iOS dependencies
        run: |
          "$RUNNER_TEMP/vcpkg/vcpkg" install \
            glib:arm64-ios \
            pixman:arm64-ios \
            libslirp:arm64-ios \
            sdl3:arm64-ios \
            zlib:arm64-ios \
            libepoxy:arm64-ios \
            libpcap:arm64-ios \
            libsamplerate:arm64-ios

      - name: Download MoltenVK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --retry 5 --retry-all-errors -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/KhronosGroup/MoltenVK/releases/latest \
            -o "$RUNNER_TEMP/mvk.json"
          ASSET_API_URL=$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(next(a["url"] for a in d["assets"] if a["name"].endswith((".tar",".tar.gz",".zip"))))' "$RUNNER_TEMP/mvk.json")
          ASSET_NAME=$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(next(a["name"] for a in d["assets"] if a["name"].endswith((".tar",".tar.gz",".zip"))))' "$RUNNER_TEMP/mvk.json")
          echo "Downloading MoltenVK asset: $ASSET_NAME"
          curl --retry 5 --retry-all-errors -fL -H "Accept: application/octet-stream" -H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" "$ASSET_API_URL" -o "$RUNNER_TEMP/mvk.pkg"
          mkdir -p "$RUNNER_TEMP/mvk"
          if file "$RUNNER_TEMP/mvk.pkg" | grep -qi zip; then unzip -q "$RUNNER_TEMP/mvk.pkg" -d "$RUNNER_TEMP/mvk"; else tar -xf "$RUNNER_TEMP/mvk.pkg" -C "$RUNNER_TEMP/mvk"; fi
          MOLTENVK_ROOT=$(find "$RUNNER_TEMP/mvk" -type f -path '*/include/vulkan/vulkan.h' -print -quit | sed 's#/include/vulkan/vulkan.h##')
          MOLTENVK_FRAMEWORK=$(find "$RUNNER_TEMP/mvk" -type d -path '*/MoltenVK.xcframework/ios-arm64/MoltenVK.framework' -print -quit)
          test -n "$MOLTENVK_ROOT"
          test -f "$MOLTENVK_FRAMEWORK/MoltenVK"
          echo "MOLTENVK_ROOT=$MOLTENVK_ROOT" >> "$GITHUB_ENV"
          echo "MOLTENVK_FRAMEWORK=$MOLTENVK_FRAMEWORK" >> "$GITHUB_ENV"

      - name: Build embedded iOS core
        run: |
          chmod +x ios/scripts/build-core-ios.sh
          ios/scripts/build-core-ios.sh
          test -f build-ios-arm64/libxemu-ios-core.dylib

      - name: Build unsigned app
        run: |
          xcodebuild -project ios/DukeX/DukeX.xcodeproj -scheme DukeX -configuration Release -sdk iphoneos -destination "generic/platform=iOS" -derivedDataPath "$RUNNER_TEMP/DukeXDerivedData" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          APP="$RUNNER_TEMP/DukeXDerivedData/Build/Products/Release-iphoneos/DukeX.app"
          test -d "$APP"
          mkdir -p "$APP/Frameworks"
          rm -rf "$APP/Frameworks/MoltenVK.framework"
          ditto "$MOLTENVK_FRAMEWORK" "$APP/Frameworks/MoltenVK.framework"
          test -f "$APP/Frameworks/MoltenVK.framework/MoltenVK"
          echo "APP_PATH=$APP" >> "$GITHUB_ENV"

      - name: Verify packaged Vulkan runtime
        run: |
          test -f "$APP_PATH/Frameworks/MoltenVK.framework/MoltenVK"
          file "$APP_PATH/Frameworks/MoltenVK.framework/MoltenVK" | grep -q 'arm64'
          echo "MoltenVK iOS runtime is present in the app bundle."

      - name: Package unsigned IPA
        run: |
          mkdir Payload
          cp -R "$APP_PATH" Payload/DukeX.app
          find Payload -name '._*' -delete || true
          xattr -cr Payload || true
          ditto -c -k --sequesterRsrc --keepParent Payload DukeX-self-patched-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: DukeX-self-patched-unsigned-ipa
          path: DukeX-self-patched-unsigned.ipa
          retention-days: 14
