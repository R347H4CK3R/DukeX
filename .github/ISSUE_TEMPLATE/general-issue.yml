name: General Issue
description: Report a DukeX issue, not specific to one particular game
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report. This template is for reporting DukeX app, install, UI, JIT, input, or system issues that are not tied to one specific game.

        Before submitting this bug report, please check the pre-submission checklist:
        - Are you using the latest DukeX build?
        - Have you checked to see if this issue has already been submitted?
        - Have you confirmed whether JIT was enabled for the launch?
        - Have you confirmed your required system files are present in the app's BIOS folder?
  - type: textarea
    id: bug-description
    attributes:
      label: Bug Description
      description: |
        A brief description of the problem, including steps to reproduce the issue and any relevant screenshots of the problem.

        Tip: You can attach images by clicking this area to highlight it and then dragging files in.
      placeholder: |
        Controller input no longer works after reconnecting.

        Steps to reproduce this issue:
        1. Launch DukeX
        2. Connect a controller
        3. Launch the dashboard
        4. Disconnect and reconnect the controller
        5. Input no longer reaches the emulator
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: A brief description of the expected behavior.
      placeholder: |
        Rumble should work after reconnecting.
    validations:
      required: true
  - type: textarea
    id: dukex-version
    attributes:
      label: DukeX Version
      description: Affected DukeX build or commit. If known, include the last known-working build.
      placeholder: |
        0.0.0-00-g0000000000

        Last working in: 0.0.0-00-g0000000000
    validations:
      required: true
  - type: textarea
    id: system-information
    attributes:
      label: System Information
      description: Basic information about your system.
      placeholder: |
        Device: iPhone 16 Pro
        iOS: 26.3.1
        Install method: sideload
        JIT method: StikDebug Universal.js
        TB cache size: 128 MB
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Any additional information or log output.
