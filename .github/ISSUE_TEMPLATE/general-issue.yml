name: General Issue
description: Report a DukeX issue, not specific to one particular game
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Use this template for app, install, UI, JIT, input, or system issues
        that are not tied to one specific title. Check for an existing issue
        first and include whether JIT was enabled.
  - type: textarea
    id: bug-description
    attributes:
      label: Problem
      description: Describe the issue and the steps needed to reproduce it.
      placeholder: |
        Controller input no longer works after reconnecting.

        Steps to reproduce this issue:
        1. Launch DukeX
        2. Connect a controller
        3. Launch the dashboard
        4. Disconnect and reconnect the controller
        5. Input no longer reaches the emulator
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What should have happened instead?
      placeholder: |
        Rumble should work after reconnecting.
    validations:
      required: true
  - type: textarea
    id: dukex-version
    attributes:
      label: DukeX Version
      description: Affected DukeX build or commit. If known, include the last known-working build.
      placeholder: |
        0.0.0-00-g0000000000

        Last working in: 0.0.0-00-g0000000000
    validations:
      required: true
  - type: textarea
    id: system-information
    attributes:
      label: System Information
      description: Device, iOS version, install method, JIT path, and relevant settings.
      placeholder: |
        Device: iPhone 16 Pro
        iOS: 26.3.1
        Install method: sideload
        JIT method: StikDebug Universal.js
        TB cache size: 128 MB
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Screenshots, logs, or details that do not fit above.
