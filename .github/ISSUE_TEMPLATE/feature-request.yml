name: Feature Request
description: Request a new feature for DukeX
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this feature request!

        Before submitting this request, please check the pre-submission checklist:
        - Have you searched to see if this feature has been requested before?
        - Is the request specific to DukeX rather than upstream xemu?
        - If this is device-specific, include your iPhone model and iOS version.
  - type: textarea
    id: feature-request
    attributes:
      label: Feature Request
      description: |
        A brief description of the requested feature. If appropriate, include screenshots or videos.

        Tip: You can attach images by clicking this area to highlight it and then dragging files in.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Possible alternative options that you have considered.
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Any other context or screenshots about the feature request.
