name: Feature Request
description: Propose a focused DukeX feature or workflow improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Before opening a request, check for an existing issue and make sure the
        request is specific to DukeX rather than upstream xemu.
  - type: textarea
    id: feature-request
    attributes:
      label: Proposal
      description: Describe the feature, workflow, or compatibility improvement.
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Use Case
      description: Explain who benefits and how the change would be used on-device.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other approaches considered, if any.
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Device details, screenshots, links, or notes that help frame the request.
