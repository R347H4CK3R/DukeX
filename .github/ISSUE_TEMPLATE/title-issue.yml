name: Title Issue
description: Report a specific game issue in DukeX
title: "Title Name: Short Description"
labels: [bug, triage]
body:
  - type: markdown
    attributes:
      value: |
        Use this template for title-specific video, audio, performance, input,
        networking, or compatibility issues. Check for an existing issue first
        and confirm whether JIT was enabled.
  - type: textarea
    id: game-title
    attributes:
      label: Title
      description: Affected game title, region, and version information.
      placeholder: |
        NTSC MS-004 v1.01
    validations:
      required: true
  - type: textarea
    id: bug-description
    attributes:
      label: Problem
      description: Describe the issue and the steps needed to reproduce it.
      placeholder: |
        HUD elements in campaign missions are not visible. See attached screenshot for example.

        Steps to reproduce this issue:
        1. Launch game
        2. Select campaign
        3. Expected HUD elements are not shown

        <Screenshot>
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected Behavior
      description: What should have happened instead?
      placeholder: |
        When playing campaign missions, HUD elements are expected in all four corners. See attached screenshot for example.

        <Screenshot>
    validations:
      required: true
  - type: textarea
    id: dukex-version
    attributes:
      label: DukeX Version
      description: Affected DukeX build or commit. If known, include the last known-working build.
      placeholder: |
        0.0.0-00-g0000000000

        Last working in: 0.0.0-00-g0000000000
    validations:
      required: true
  - type: textarea
    id: system-information
    attributes:
      label: System Information
      description: Device, iOS version, install method, JIT path, and relevant settings.
      placeholder: |
        Device: iPhone 16 Pro
        iOS: 26.3.1
        Install method: sideload
        JIT method: StikDebug Universal.js
        TB cache size: 128 MB
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Screenshots, videos, logs, or additional notes.
